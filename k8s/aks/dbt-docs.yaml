apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt-docs
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: dbt-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dbt-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dbt-docs
      annotations:
        dbt-docs/build-id: "__DBT_DOCS_BUILD_ID__"
    spec:
      initContainers:
        - name: generate-dbt-docs
          image: __DBT_DOCS_GENERATOR_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: WAREHOUSE_HOST
              value: warehouse
            - name: WAREHOUSE_PORT
              value: "5432"
            - name: WAREHOUSE_DB
              valueFrom:
                secretKeyRef:
                  name: odp-env
                  key: WAREHOUSE_DB
            - name: WAREHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: odp-env
                  key: WAREHOUSE_USER
            - name: WAREHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odp-env
                  key: WAREHOUSE_PASSWORD
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              rm -rf /tmp/dbt_project
              cp -r /opt/airflow/project/dbt /tmp/dbt_project
              dbt deps --project-dir /tmp/dbt_project --profiles-dir /tmp/dbt_project
              dbt docs generate --project-dir /tmp/dbt_project --profiles-dir /tmp/dbt_project --vars '{use_seed_data: true}'
              rm -rf /docs/*
              cp -r /tmp/dbt_project/target/. /docs/
          volumeMounts:
            - name: docs-data
              mountPath: /docs
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: docs-data
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: docs-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dbt-docs
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: dbt-docs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dbt-docs
  ports:
    - name: http
      port: 80
      targetPort: 80
