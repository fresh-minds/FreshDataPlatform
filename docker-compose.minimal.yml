services:
  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__ADMIN__USER=${AIRFLOW_ADMIN_USER:-admin}
      - AIRFLOW__ADMIN__PASSWORD=${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD}
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__FAB__CONFIG_FILE=/opt/airflow/webserver_config.py
      - AIRFLOW_OAUTH_CLIENT_ID=${KEYCLOAK_AIRFLOW_CLIENT_ID:-airflow}
      - AIRFLOW_OAUTH_CLIENT_SECRET=${KEYCLOAK_AIRFLOW_CLIENT_SECRET:?Set KEYCLOAK_AIRFLOW_CLIENT_SECRET}
      - AIRFLOW_OAUTH_BASE_URL=${KEYCLOAK_OIDC_BASE_URL:-http://keycloak:8090/realms/odp/protocol/openid-connect}
      - AIRFLOW_OAUTH_AUTHORIZE_URL=${KEYCLOAK_OIDC_BROWSER_AUTHORIZE_URL:-http://localhost:8090/realms/odp/protocol/openid-connect/auth}
      - AIRFLOW_OAUTH_TOKEN_URL=${KEYCLOAK_OIDC_TOKEN_URL:-http://keycloak:8090/realms/odp/protocol/openid-connect/token}
      - AIRFLOW_OAUTH_DISCOVERY_URL=${KEYCLOAK_OIDC_DISCOVERY_URL:-http://keycloak:8090/realms/odp/.well-known/openid-configuration}
      - AIRFLOW_OAUTH_ISSUER=${AIRFLOW_OAUTH_ISSUER:-http://localhost:8090/realms/odp}
      - AIRFLOW_OAUTH_JWKS_URL=${AIRFLOW_OAUTH_JWKS_URL:-http://keycloak:8090/realms/odp/protocol/openid-connect/certs}
      - AIRFLOW_OAUTH_DEFAULT_ROLE=${AIRFLOW_OAUTH_DEFAULT_ROLE:-Viewer}
      - AIRFLOW__METRICS__STATSD_ON=False
      - OTEL_ENABLED=false
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - PLAYWRIGHT_BROWSERS_PATH=/opt/airflow/playwright
      - PYTHONPATH=/opt/airflow/project
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
      - ./data:/opt/airflow/project/data
      - ./airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "[ -f /opt/airflow/airflow-webserver.pid ]"]
      interval: 30s
      timeout: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__METRICS__STATSD_ON=False
      - OTEL_ENABLED=false
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - PYTHONPATH=/opt/airflow/project
      - USE_DATAHUB=false
      - PLAYWRIGHT_BROWSERS_PATH=/opt/airflow/playwright
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      - WAREHOUSE_HOST=warehouse
      - WAREHOUSE_PORT=5432
      - WAREHOUSE_DB=${WAREHOUSE_DB:-open_data_platform_dw}
      - WAREHOUSE_USER=${WAREHOUSE_USER:?Set WAREHOUSE_USER}
      - WAREHOUSE_PASSWORD=${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
      - ./data:/opt/airflow/project/data
    command: scheduler
    depends_on:
      postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME:-airflow}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/opt/airflow/project
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      "
    depends_on:
      - postgres

  postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      - POSTGRES_USER=${AIRFLOW_DB_USER:?Set AIRFLOW_DB_USER}
      - POSTGRES_PASSWORD=${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}
      - POSTGRES_DB=${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    container_name: open-data-platform-keycloak
    environment:
      - KC_HOSTNAME=http://localhost:8090
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:?Set KEYCLOAK_ADMIN_USER}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_AIRFLOW_CLIENT_SECRET=${KEYCLOAK_AIRFLOW_CLIENT_SECRET:?Set KEYCLOAK_AIRFLOW_CLIENT_SECRET}
      - KEYCLOAK_DATAHUB_CLIENT_SECRET=${KEYCLOAK_DATAHUB_CLIENT_SECRET:-change_me_keycloak_datahub_secret}
      - KEYCLOAK_MINIO_CLIENT_SECRET=${KEYCLOAK_MINIO_CLIENT_SECRET:?Set KEYCLOAK_MINIO_CLIENT_SECRET}
      - KEYCLOAK_SUPERSET_CLIENT_SECRET=${KEYCLOAK_SUPERSET_CLIENT_SECRET:-change_me_keycloak_superset_secret}
      - KEYCLOAK_GRAFANA_CLIENT_SECRET=${KEYCLOAK_GRAFANA_CLIENT_SECRET:-change_me_keycloak_grafana_secret}
      - KEYCLOAK_DEFAULT_USER_PASSWORD=${KEYCLOAK_DEFAULT_USER_PASSWORD:?Set KEYCLOAK_DEFAULT_USER_PASSWORD}
      - KEYCLOAK_DEMO_USER_PASSWORD=${KEYCLOAK_DEMO_USER_PASSWORD:-demo}
      - KEYCLOAK_DEMO_AUTO_LOGIN=${KEYCLOAK_DEMO_AUTO_LOGIN:-false}
      - KEYCLOAK_DEMO_AUTOLOGIN_USERNAME=${KEYCLOAK_DEMO_AUTOLOGIN_USERNAME:-odp-admin}
    entrypoint: ["/bin/sh", "/opt/keycloak/data/import/scripts/start_with_demo_theme.sh"]
    ports:
      - "8090:8090"
    volumes:
      - ./ops/keycloak:/opt/keycloak/data/import

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: open-data-platform-minio
    depends_on:
      - keycloak
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_PROMETHEUS_JOB_ID=minio
      - MINIO_IDENTITY_OPENID_ENABLE=on
      - MINIO_IDENTITY_OPENID_DISPLAY_NAME=${MINIO_OIDC_DISPLAY_NAME:-Keycloak}
      - MINIO_IDENTITY_OPENID_CONFIG_URL=${KEYCLOAK_OIDC_DISCOVERY_URL:-http://keycloak:8090/realms/odp/.well-known/openid-configuration}
      - MINIO_IDENTITY_OPENID_CLIENT_ID=${KEYCLOAK_MINIO_CLIENT_ID:-minio}
      - MINIO_IDENTITY_OPENID_CLIENT_SECRET=${KEYCLOAK_MINIO_CLIENT_SECRET:?Set KEYCLOAK_MINIO_CLIENT_SECRET}
      - MINIO_IDENTITY_OPENID_SCOPES=openid,profile,email
      - MINIO_IDENTITY_OPENID_CLAIM_NAME=policy
      - MINIO_IDENTITY_OPENID_ROLE_POLICY=${MINIO_OIDC_ROLE_POLICY:-}
      - MINIO_IDENTITY_OPENID_REDIRECT_URI=http://localhost:9001/oauth_callback
      - MINIO_BROWSER_REDIRECT_URL=http://localhost:9001
      - MINIO_SERVER_URL=http://localhost:9000
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  minio-sso-bridge:
    build:
      context: .
      dockerfile: ops/minio-sso-bridge/Dockerfile
    container_name: open-data-platform-minio-sso-bridge
    depends_on:
      - minio
      - keycloak
    environment:
      - BRIDGE_BASE_URL=${MINIO_SSO_BRIDGE_BASE_URL:-http://localhost:9011}
      - MINIO_SSO_BRIDGE_SESSION_SECRET=${MINIO_SSO_BRIDGE_SESSION_SECRET:?Set MINIO_SSO_BRIDGE_SESSION_SECRET}
      - MINIO_SSO_BRIDGE_STATE_TTL_SECONDS=${MINIO_SSO_BRIDGE_STATE_TTL_SECONDS:-300}
      - KEYCLOAK_BROWSER_BASE_URL=${KEYCLOAK_BROWSER_BASE_URL:-http://localhost:8090}
      - KEYCLOAK_INTERNAL_BASE_URL=${KEYCLOAK_INTERNAL_BASE_URL:-http://keycloak:8090}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-odp}
      - KEYCLOAK_MINIO_CLIENT_ID=${KEYCLOAK_MINIO_CLIENT_ID:-minio}
      - KEYCLOAK_MINIO_CLIENT_SECRET=${KEYCLOAK_MINIO_CLIENT_SECRET:?Set KEYCLOAK_MINIO_CLIENT_SECRET}
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USER:?Set KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_ADMIN_REALM=${KEYCLOAK_ADMIN_REALM:-master}
      - MINIO_CONSOLE_PUBLIC_URL=${MINIO_CONSOLE_PUBLIC_URL:-http://localhost:9001}
      - MINIO_CONSOLE_INTERNAL_URL=http://minio:9001
      - MINIO_API_INTERNAL_URL=http://minio:9000
      - LOG_LEVEL=${MINIO_SSO_BRIDGE_LOG_LEVEL:-INFO}
    ports:
      - "9011:9011"

  create-buckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}; /usr/bin/mc mb myminio/bronze; /usr/bin/mc mb myminio/silver; /usr/bin/mc mb myminio/gold; exit 0; "

  warehouse:
    image: postgres:15
    container_name: open-data-platform-warehouse
    environment:
      - POSTGRES_USER=${WAREHOUSE_USER:?Set WAREHOUSE_USER}
      - POSTGRES_PASSWORD=${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD}
      - POSTGRES_DB=${WAREHOUSE_DB:-open_data_platform_dw}
    ports:
      - "5433:5432"
    volumes:
      - warehouse-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:?Set WAREHOUSE_USER} -d ${WAREHOUSE_DB:-open_data_platform_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset:
    image: apache/superset:3.0.0
    container_name: open-data-platform-superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY}
      - SUPERSET_WTF_CSRF_ENABLED=${SUPERSET_WTF_CSRF_ENABLED:-true}
      - SUPERSET_OAUTH_DEFAULT_ROLE=${SUPERSET_OAUTH_DEFAULT_ROLE:-Admin}
      - SUPERSET_ALLOW_AUTO_ADMIN_ROLE=${SUPERSET_ALLOW_AUTO_ADMIN_ROLE:-false}
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://${SUPERSET_DB_USER:?Set SUPERSET_DB_USER}:${SUPERSET_DB_PASSWORD:?Set SUPERSET_DB_PASSWORD}@superset-db/${SUPERSET_DB_NAME:-superset}
      - SUPERSET_ADMIN_USER=${SUPERSET_ADMIN_USER:-admin}
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD}
      - MAPBOX_API_KEY=${MAPBOX_API_KEY:-}
      - KEYCLOAK_SUPERSET_CLIENT_ID=${KEYCLOAK_SUPERSET_CLIENT_ID:-superset}
      - KEYCLOAK_SUPERSET_CLIENT_SECRET=${KEYCLOAK_SUPERSET_CLIENT_SECRET:-change_me_keycloak_superset_secret}
      - KEYCLOAK_OIDC_BASE_URL=${KEYCLOAK_OIDC_BASE_URL:-http://keycloak:8090/realms/odp/protocol/openid-connect}
      - KEYCLOAK_OIDC_DISCOVERY_URL=${KEYCLOAK_OIDC_DISCOVERY_URL:-http://keycloak:8090/realms/odp/.well-known/openid-configuration}
      - KEYCLOAK_OIDC_TOKEN_URL=${KEYCLOAK_OIDC_TOKEN_URL:-http://keycloak:8090/realms/odp/protocol/openid-connect/token}
      - KEYCLOAK_OIDC_SUPERSET_BROWSER_AUTHORIZE_URL=${KEYCLOAK_OIDC_SUPERSET_BROWSER_AUTHORIZE_URL:-http://localhost:8090/realms/odp/protocol/openid-connect/auth}
      - WAREHOUSE_HOST=warehouse
      - WAREHOUSE_PORT=5432
      - WAREHOUSE_DB=${WAREHOUSE_DB:-open_data_platform_dw}
      - WAREHOUSE_USER=${WAREHOUSE_USER:?Set WAREHOUSE_USER}
      - WAREHOUSE_PASSWORD=${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD}
      - STAFFING_DEMAND_SCHEMA=${STAFFING_DEMAND_SCHEMA:-gold}
    depends_on:
      - superset-db
      - warehouse
    command: >
      sh -c "
        pip install --no-cache-dir authlib &&
        superset fab create-admin --username ${SUPERSET_ADMIN_USER:-admin} --firstname Superset --lastname Admin --email ${SUPERSET_ADMIN_EMAIL:-admin@superset.com} --password ${SUPERSET_ADMIN_PASSWORD:?Set SUPERSET_ADMIN_PASSWORD} || true &&
        superset db upgrade &&
        superset init &&
        /usr/bin/run-server.sh &
        SERVER_PID=$$! &&
        echo \"[Superset] Waiting for /health...\" &&
        for i in $$(seq 1 60); do curl -sSf http://localhost:8088/health >/dev/null && break || sleep 2; done &&
        python /app/scripts/superset/superset_bootstrap_odp_staffing_demand.py || true &&
        python /app/scripts/superset/superset_bootstrap_gold_dashboards.py || true &&
        python /app/scripts/superset/superset_bootstrap_platform_metadata.py || true &&
        wait $$SERVER_PID"
    volumes:
      - ./scripts/superset/superset_config.py:/app/pythonpath/superset_config.py
      - ./scripts:/app/scripts
      - ./schema:/app/schema:ro

  superset-db:
    image: postgres:15
    container_name: superset-postgres
    environment:
      - POSTGRES_USER=${SUPERSET_DB_USER:?Set SUPERSET_DB_USER}
      - POSTGRES_PASSWORD=${SUPERSET_DB_PASSWORD:?Set SUPERSET_DB_PASSWORD}
      - POSTGRES_DB=${SUPERSET_DB_NAME:-superset}
    volumes:
      - superset-db-volume:/var/lib/postgresql/data

  portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: open-data-platform-portal
    environment:
      - VITE_KEYCLOAK_URL=${KEYCLOAK_BROWSER_BASE_URL:-http://localhost:8090}
      - VITE_KEYCLOAK_REALM=odp
      - VITE_KEYCLOAK_CLIENT_ID=portal
      - VITE_PORTAL_API_URL=${PORTAL_API_PUBLIC_URL:-http://localhost:8070}
      - VITE_DBT_DOCS_URL=${DBT_DOCS_PUBLIC_URL:-http://localhost:8089}
      - VITE_SHOW_DEMO_RIBBON=${VITE_SHOW_DEMO_RIBBON:-true}
      - VITE_DEMO_AUTO_ADMIN=${VITE_DEMO_AUTO_ADMIN:-false}
      - VITE_DEMO_USERNAME=${VITE_DEMO_USERNAME:-odp-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      keycloak:
        condition: service_started

  dbt-docs-generate:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: open-data-platform-dbt-docs-generate
    environment:
      - WAREHOUSE_HOST=warehouse
      - WAREHOUSE_PORT=5432
      - WAREHOUSE_DB=${WAREHOUSE_DB:-open_data_platform_dw}
      - WAREHOUSE_USER=${WAREHOUSE_USER:?Set WAREHOUSE_USER}
      - WAREHOUSE_PASSWORD=${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD}
    command: >
      bash -lc "
        for i in $(seq 1 30); do
          dbt docs generate --project-dir /opt/airflow/project/dbt --profiles-dir /opt/airflow/project/dbt && exit 0;
          echo '[dbt-docs-generate] retrying dbt docs generate...';
          sleep 2;
        done;
        echo '[dbt-docs-generate] failed to generate docs after retries';
        exit 1
      "
    volumes:
      - ./:/opt/airflow/project
      - ./dbt:/opt/airflow/project/dbt
    depends_on:
      warehouse:
        condition: service_healthy

  dbt-docs:
    image: nginx:1.27-alpine
    container_name: open-data-platform-dbt-docs
    ports:
      - "8089:80"
    volumes:
      - ./dbt/target:/usr/share/nginx/html:ro
      - ./ops/dbt-docs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dbt-docs-generate:
        condition: service_completed_successfully

  portal-api:
    build:
      context: .
      dockerfile: ops/portal-api/Dockerfile
    container_name: open-data-platform-portal-api
    environment:
      - KEYCLOAK_INTERNAL_BASE_URL=${KEYCLOAK_INTERNAL_BASE_URL:-http://keycloak:8090}
      - KEYCLOAK_REALM=odp
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USER:?Set KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_ADMIN_REALM=${KEYCLOAK_ADMIN_REALM:-master}
      - PORTAL_CLIENT_ID=portal
      - PORTAL_CORS_ORIGINS=${PORTAL_CORS_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${PORTAL_API_LOG_LEVEL:-INFO}
      - AZURE_EXISTING_AIPROJECT_ENDPOINT=${AZURE_EXISTING_AIPROJECT_ENDPOINT:-${AZURE_FOUNDRY_AGENT_ENDPOINT:-}}
      - AZURE_EXISTING_AGENT_ID=${AZURE_EXISTING_AGENT_ID:-${AZURE_FOUNDRY_AGENT_ID:-}}
      - AZURE_EXISTING_AGENT_NAME=${AZURE_EXISTING_AGENT_NAME:-${AZURE_FOUNDRY_AGENT_NAME:-}}
      - AZURE_FOUNDRY_AGENT_ENDPOINT=${AZURE_FOUNDRY_AGENT_ENDPOINT:-${AZURE_EXISTING_AIPROJECT_ENDPOINT:-}}
      - AZURE_FOUNDRY_AGENT_ID=${AZURE_FOUNDRY_AGENT_ID:-${AZURE_EXISTING_AGENT_ID:-}}
      - AZURE_FOUNDRY_AGENT_NAME=${AZURE_FOUNDRY_AGENT_NAME:-${AZURE_EXISTING_AGENT_NAME:-}}
      - AZURE_FOUNDRY_API_KEY=${AZURE_FOUNDRY_API_KEY:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
    ports:
      - "8070:8070"
    depends_on:
      keycloak:
        condition: service_started

  postgres-exporter-airflow:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: open-data-platform-postgres-exporter-airflow
    environment:
      - DATA_SOURCE_NAME=postgresql://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - postgres

  postgres-exporter-warehouse:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: open-data-platform-postgres-exporter-warehouse
    environment:
      - DATA_SOURCE_NAME=postgresql://${WAREHOUSE_USER}:${WAREHOUSE_PASSWORD}@warehouse:5432/${WAREHOUSE_DB:-open_data_platform_dw}?sslmode=disable
    ports:
      - "9188:9187"
    depends_on:
      - warehouse

volumes:
  postgres-db-volume:
  warehouse-db-volume:
  superset-db-volume:
  minio-data:
