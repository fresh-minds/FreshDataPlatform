entity: skill
domain: odp_staffing_demand
description: "Technology or competency extracted from job ad descriptions"
type: reference

layer_mapping:
  bronze_source: it_market_top_skills
  silver_model: null
  gold_model: fact_it_market_top_skills
  gold_dimensions: []

attributes:
  - name: skill
    type: text
    primary_key: true
    not_null: true
    description: "Skill name extracted from job ad descriptions"

  - name: count
    type: integer
    not_null: true
    description: "Number of job ads mentioning this skill"
    constraints:
      min: 0

sources:
  - source_name: adzuna
    dag: adzuna_job_ads_pipeline
    extraction: rest_api
    schedule: "30 1 * * *"
    description: "Skills extracted from Adzuna job ad descriptions using NLP"

quality:
  freshness:
    column: loaded_at
    max_age_hours: 48
    severity: medium
  checks:
    - type: unique
      columns: [skill]
    - type: non_null
      columns: [skill, count]
    - type: value_range
      column: count
      min: 0
      max_invalid_pct: 0

governance:
  sensitivity: public
  pii_columns: []
  retention_days: 365
  require_rbac: false
