version: 2

models:
  # ── Dimensions ────────────────────────────────────────────────────

  - name: dim_period
    description: "Period dimension derived from CBS snapshot data."
    config:
      materialized: table
      tags: ['job_market', 'dimension']
    columns:
      - name: period_sk
        description: "Surrogate key (MD5 hash of period_key)."
        tests:
          - not_null
          - unique
      - name: period_key
        description: "Natural business key (e.g. 2024Q1)."
        tests:
          - not_null
          - unique
      - name: period_label
        description: "Human-readable period label."

  - name: dim_sector
    description: "Industry sector dimension from CBS SIC2008 classification."
    config:
      materialized: table
      tags: ['job_market', 'dimension']
    columns:
      - name: sector_sk
        description: "Surrogate key (MD5 hash of sector_name)."
        tests:
          - not_null
          - unique
      - name: sector_name
        description: "Sector name."
        tests:
          - not_null
          - unique

  # Note: dim_region and dim_company have been moved to
  # dbt/models/gold/_shared/ as conformed dimensions shared across domains.
  # They retain the same model names (dim_region, dim_company) so all
  # {{ ref('dim_region') }} and {{ ref('dim_company') }} calls resolve
  # without changes.

  # ── Facts ─────────────────────────────────────────────────────────

  - name: fact_it_market_snapshot
    description: >
      Star-schema fact table: IT market snapshot with dimension surrogate key
      references and enriched context (regions, skills).
    config:
      materialized: table
      tags: ['job_market', 'fact']
    columns:
      - name: snapshot_sk
        description: "Surrogate key (MD5 hash of period_key + sector_name)."
        tests:
          - not_null
          - unique
      - name: period_sk
        description: "FK to dim_period."
        tests:
          - not_null
          - relationships:
              to: ref('dim_period')
              field: period_sk
      - name: sector_sk
        description: "FK to dim_sector."
        tests:
          - not_null
          - relationships:
              to: ref('dim_sector')
              field: sector_sk
      - name: vacancies
        description: "Number of open vacancies."
      - name: vacancy_rate
        description: "Vacancy rate percentage."
      - name: job_ads_count
        tests:
          - not_null
      - name: regions_with_ads
        tests:
          - not_null
      - name: distinct_skills_count
        tests:
          - not_null

  - name: fact_it_market_top_skills
    description: "Fact table of skill demand from IT job advertisements."
    config:
      materialized: table
      tags: ['job_market', 'fact']
    columns:
      - name: skill_sk
        description: "Surrogate key (MD5 hash of skill name)."
        tests:
          - not_null
          - unique
      - name: skill
        tests:
          - not_null
          - unique
      - name: mention_count
        description: "Number of job ads mentioning this skill."
        tests:
          - not_null

  - name: fact_job_postings
    description: >
      Star-schema fact table for individual Harvey Nash job postings.
      Each row is one vacancy with FK references to dim_region and dim_company.
      Region FK may be null when the city cannot be resolved to a Dutch province.
    config:
      materialized: table
      tags: ['job_market', 'fact']
    columns:
      - name: posting_sk
        description: "Surrogate key (MD5 hash of job_id)."
        tests:
          - not_null
          - unique
      - name: region_sk
        description: "FK to dim_region (null when city cannot be resolved to a province)."
        tests:
          - relationships:
              to: ref('dim_region')
              field: region_sk
      - name: company_sk
        description: "FK to dim_company."
        tests:
          - relationships:
              to: ref('dim_company')
              field: company_sk
      - name: job_id
        description: "Natural business key for the job posting."
        tests:
          - not_null
          - unique
      - name: title
        description: "Job title."
        tests:
          - not_null
      - name: company
        description: "Company name (denormalized from dim_company for convenience)."
      - name: location
        description: "Raw location string from Harvey Nash (city level)."
      - name: province
        description: "Resolved Dutch province (nullable)."
      - name: contract_type
        description: "Contract type (e.g. permanent, freelance)."
      - name: description
        description: "Plain-text job description."
      - name: salary_min
        description: "Minimum salary or rate (nullable)."
      - name: salary_max
        description: "Maximum salary or rate (nullable)."
      - name: salary_raw
        description: "Raw salary text from the card (e.g. 'Tarief in overleg')."
      - name: url
        description: "Canonical URL of the job posting."
      - name: posted_date
        description: "Date/time the posting was published (nullable)."
      - name: source
        description: "Source tag, always HARVEY_NASH."
        tests:
          - not_null
      - name: ingestion_timestamp
        description: "Timestamp when the row was ingested."
        tests:
          - not_null

  # ── Fabric Landing Dimensions ────────────────────────────────────

  - name: dim_role
    description: "Job role dimension with cluster groupings from fabric_landing."
    config:
      materialized: table
      tags: ['job_market', 'dimension', 'fabric']
    columns:
      - name: role_sk
        description: "Surrogate key (MD5 hash of role_name)."
        tests:
          - not_null
          - unique
      - name: role_name
        description: "Job role name."
        tests:
          - not_null
          - unique
      - name: role_cluster
        description: "Role cluster grouping (e.g. Cloud DevOps & Platform Engineering)."

  - name: dim_unit
    description: "Business unit dimension from fabric_landing (9 units)."
    config:
      materialized: table
      tags: ['job_market', 'dimension', 'fabric']
    columns:
      - name: unit_sk
        description: "Surrogate key (MD5 hash of unit_name)."
        tests:
          - not_null
          - unique
      - name: unit_name
        description: "Business unit name (e.g. Data, Software, Security)."
        tests:
          - not_null
          - unique

  - name: dim_location
    description: "Location dimension derived from fabric staffing request locations."
    config:
      materialized: table
      tags: ['job_market', 'dimension', 'fabric']
    columns:
      - name: location_sk
        description: "Surrogate key (MD5 hash of location_name)."
        tests:
          - not_null
          - unique
      - name: location_name
        description: "Cleaned location name."
        tests:
          - not_null
          - unique

  # ── Fabric Landing Facts ─────────────────────────────────────────

  - name: fact_aanvragen
    description: >
      Star-schema fact table for staffing/recruitment requests from
      fabric_landing. Each row is one request with FK references to
      dim_date, dim_company, dim_role, dim_unit, and dim_location.
      Covers Sep 2020 -- Jan 2026 (79k rows).
    config:
      materialized: table
      tags: ['job_market', 'fact', 'fabric']
    columns:
      - name: aanvraag_sk
        description: "Surrogate key (MD5 hash of aanvraag_id)."
        tests:
          - not_null
          - unique
      - name: date_sk
        description: "FK to dim_date (nullable if date_received is null)."
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_sk
      - name: company_sk
        description: "FK to dim_company (nullable if organisatie is null)."
        tests:
          - relationships:
              to: ref('dim_company')
              field: company_sk
      - name: role_sk
        description: "FK to dim_role (nullable if rol is null)."
        tests:
          - relationships:
              to: ref('dim_role')
              field: role_sk
      - name: unit_sk
        description: "FK to dim_unit (nullable if unit is null)."
        tests:
          - relationships:
              to: ref('dim_unit')
              field: unit_sk
      - name: location_sk
        description: "FK to dim_location (nullable if locatie_clean is null)."
        tests:
          - relationships:
              to: ref('dim_location')
              field: location_sk
      - name: aanvraag_id
        description: "Natural business key."
        tests:
          - not_null
          - unique
      - name: source
        description: "Email source (mail_info, mail_das, mail_aanvragen)."
      - name: date_received
        description: "Timestamp when the request was received."
        tests:
          - not_null

# ── Exposures ─────────────────────────────────────────────────────

exposures:
  - name: superset_it_market_dashboard
    type: dashboard
    description: >
      IT Market Dashboard in Superset showing vacancy trends, top skills,
      and regional distribution of IT job ads in the Netherlands.
    maturity: low
    url: "http://localhost:8088/superset/dashboard/it-market/"
    depends_on:
      - ref('fact_it_market_snapshot')
      - ref('fact_it_market_top_skills')
      - ref('dim_period')
      - ref('dim_sector')
      - ref('dim_region')
    owner:
      name: "Data Platform Team"
      email: "data-platform@example.com"

  - name: superset_staffing_demand_dashboard
    type: dashboard
    description: >
      ODP Staffing Demand dashboard showing request volume trends,
      geographic distribution, business unit breakdown, and top companies.
    maturity: medium
    url: "http://localhost:8088/superset/dashboard/odp-staffing/"
    depends_on:
      - ref('fact_aanvragen')
      - ref('fact_it_market_snapshot')
      - ref('fact_it_market_top_skills')
      - ref('fact_job_postings')
      - ref('dim_date')
      - ref('dim_company')
      - ref('dim_role')
      - ref('dim_unit')
      - ref('dim_location')
    owner:
      name: "Data Platform Team"
      email: "data-platform@example.com"
