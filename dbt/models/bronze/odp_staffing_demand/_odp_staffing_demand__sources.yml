version: 2

sources:
  - name: odp_staffing_demand
    description: "ODP Staffing Demand serving tables in the Postgres warehouse, populated by the Python/Spark pipeline."
    schema: "{{ var('staffing_demand_source_schema', 'odp_staffing_demand') }}"
    loader: "pipelines.odp_staffing_demand.postgres_pipeline"
    loaded_at_field: loaded_at
    freshness:
      warn_after:
        count: 48
        period: hour
      error_after:
        count: 168
        period: hour
    tables:
      - name: it_market_snapshot
        description: "Latest IT market snapshot combining CBS vacancy rate data with job ads counts."
        columns:
          - name: period_key
            description: "Period identifier (e.g. 2024Q1)"
          - name: period_label
            description: "Human-readable period label"
          - name: sector_name
            description: "Industry sector name"
          - name: vacancies
            description: "Number of open vacancies in the sector"
          - name: vacancy_rate
            description: "Vacancy rate as a percentage"
          - name: job_ads_count
            description: "Number of job advertisements found"
          - name: loaded_at
            description: "Timestamp when this row was loaded"

      - name: it_market_top_skills
        description: "Top skills extracted from IT job advertisements with frequency counts."
        columns:
          - name: skill
            description: "Skill name extracted from job ads"
          - name: count
            description: "Number of job ads mentioning this skill"
          - name: loaded_at
            description: "Timestamp when this row was loaded"

      - name: it_market_region_distribution
        description: "Regional distribution of IT job ads across Dutch provinces."
        columns:
          - name: region
            description: "Province or region name"
          - name: job_ads_count
            description: "Number of job ads in this region"
          - name: share_pct
            description: "Percentage share of total job ads"
          - name: latitude
            description: "Centroid latitude of the region"
          - name: longitude
            description: "Centroid longitude of the region"
          - name: loaded_at
            description: "Timestamp when this row was loaded"

      - name: it_market_job_ads_geo
        description: "Geo-coded individual job ad locations."
        columns:
          - name: job_id
            description: "Unique identifier for the job ad"
          - name: region
            description: "Province or region name"
          - name: latitude
            description: "Latitude of the job ad location"
          - name: longitude
            description: "Longitude of the job ad location"
          - name: location_label
            description: "Human-readable location label"
          - name: loaded_at
            description: "Timestamp when this row was loaded"

      - name: harvey_nash_vacatures
        description: "Individual job postings scraped from the Harvey Nash NL vacatures page."
        columns:
          - name: id
            description: "Numeric job posting ID extracted from the URL slug"
          - name: title
            description: "Job title"
          - name: company
            description: "Hiring company name (Harvey Nash or client name)"
          - name: location
            description: "City where the job is based (e.g. Amsterdam)"
          - name: province
            description: "Dutch province extracted from location card (e.g. Noord-Holland)"
          - name: contract_type
            description: "Contract type (e.g. permanent, freelance) — empty when not shown on card"
          - name: description
            description: "Job description — empty at card level; available on detail page"
          - name: salary_min
            description: "Minimum salary or rate (parsed from card text, nullable)"
          - name: salary_max
            description: "Maximum salary or rate (parsed from card text, nullable)"
          - name: salary_raw
            description: "Raw salary text from the card (e.g. 'Tarief in overleg')"
          - name: url
            description: "Canonical URL of the job posting"
          - name: posted_date
            description: "Date the posting was published — empty at card level"
          - name: ingestion_timestamp
            description: "Timestamp when the row was ingested"
